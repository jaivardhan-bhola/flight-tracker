name: track-flights

on:
  workflow_dispatch:        # "Run workflow" button
    inputs:
      only_watch:
        description: "Only check the watched flights (uses 2 API units per flight)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Track
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          mkdir -p data docs
          if [ -z "$RAPIDAPI_KEY" ]; then echo "::error::Secret RAPIDAPI_KEY is empty or missing. Add it under Settings > Secrets and variables > Actions (exact name RAPIDAPI_KEY)."; exit 1; fi
          if [ "${{ inputs.only_watch }}" = "true" ]; then
            python tracker.py --only-watch
          elif [ "${{ github.event.schedule }}" = "30 15 * * *" ]; then
            python tracker.py --skip-morning --skip-legs
          else
            python tracker.py
          fi
      - name: Commit results
        if: always()
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p data docs
          git add data docs
          git diff --cached --quiet || (git commit -m "tracker run $(date -u +%FT%TZ)" && git pull --rebase && git push)
